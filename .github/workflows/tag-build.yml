name: Tag build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyinstaller:
    name: PyInstaller / ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            runs-on: ubuntu-latest
            container: debian:12-slim
            artifact-arch: amd64
          - name: macos-14
            runs-on: macos-14
            container: null
            artifact-arch: macos-arm64

    steps:
      - name: Install Debian dependencies
        if: matrix.container != null
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            binutils \
            ca-certificates \
            curl \
            git \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libxcb1 \
            libxext6 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxrender1

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12

      - name: Build PyInstaller executable
        run: |
          uv run --locked --with pyinstaller pyinstaller \
            --clean \
            oh-my-ruyi.spec

      - name: Smoke-test executable
        env:
          QT_QPA_PLATFORM: offscreen
          RUYI_TELEMETRY_OPTOUT: "1"
        run: |
          uv run --locked python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile

          binary = pathlib.Path("dist/oh-my-ruyi").resolve()

          def run_checked(arguments, expected_code=0, timeout=30):
              try:
                  process = subprocess.run(
                      [os.fspath(binary), *arguments],
                      env=os.environ.copy(),
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                      check=False,
                  )
              except subprocess.TimeoutExpired as exc:
                  raise SystemExit(
                      f"command timed out after {timeout}s: {arguments}\n"
                      f"stdout:\n{exc.stdout}\nstderr:\n{exc.stderr}"
                  ) from exc
              output = f"stdout:\n{process.stdout}\nstderr:\n{process.stderr}"
              if "ModuleNotFoundError" in output:
                  raise SystemExit(
                      f"frozen child module could not be imported: {arguments}\n{output}"
                  )
              if process.returncode != expected_code:
                  raise SystemExit(
                      f"unexpected exit code {process.returncode} for {arguments}\n{output}"
                  )

          run_checked(["-m", "ruyi", "version"])
          run_checked(
              ["-m", "oh_my_ruyi.processes.version_activation_child", "--help"]
          )
          run_checked(["-m", "oh_my_ruyi.processes.repo_update_child"], 1)
          run_checked(["-m", "oh_my_ruyi.processes.repo_news_child"], 1)

          with tempfile.TemporaryDirectory() as root:
              root = pathlib.Path(root)
              installation = (
                  root / "state" / "ruyi" / "telemetry" / "installation.json"
              )
              installation.parent.mkdir(parents=True)
              installation.write_text("{}", encoding="utf-8")
              env = os.environ.copy()
              env.update(
                  {
                      "XDG_CACHE_HOME": os.fspath(root / "cache"),
                      "XDG_CONFIG_HOME": os.fspath(root / "config"),
                      "XDG_DATA_HOME": os.fspath(root / "data"),
                      "XDG_STATE_HOME": os.fspath(root / "state"),
                  }
              )
              process = subprocess.Popen(
                  [os.fspath(binary)],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  start_new_session=True,
              )
              try:
                  stdout, stderr = process.communicate(timeout=10)
              except subprocess.TimeoutExpired:
                  process.terminate()
                  try:
                      process.communicate(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.communicate()
              else:
                  raise SystemExit(
                      f"executable exited early with code {process.returncode}\n"
                      f"stdout:\n{stdout}\nstderr:\n{stderr}"
                  )
          PY

      - name: Name executable
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact="oh-my-ruyi-${version}.${{ matrix.artifact-arch }}"
          cp dist/oh-my-ruyi "$artifact"
          chmod +x "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_ENV"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}
          if-no-files-found: error

  prerelease:
    name: Create prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: pyinstaller
    runs-on: ubuntu-latest

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/oh-my-ruyi-* \
            --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes ""
